version: 2
updates:
  # .NET packages across every csproj under the repo (src/ and tests/).
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      nuget-dependencies:
        patterns:
          - "*"
    ignore:
      # Test-framework packages: major-version bumps have carried real breaking changes/licensing
      # shifts here before (Microsoft.NET.Test.Sdk 17->18, FluentAssertions 6->8's commercial
      # licensing terms) — minor/patch updates (including security patches) still flow through.
      - dependency-name: "xunit*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.NET.Test.Sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "coverlet.collector"
        update-types: ["version-update:semver-major"]

  # GitHub Actions in .github/workflows/*.yml — third-party actions are pinned to a full commit
  # SHA (see CLAUDE.md's hard constraints); Dependabot updates both the SHA and its trailing
  # "# vX.Y.Z" comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
