name: Build

# T-F122: builds the MSIX + pakko.exe on every push to main and on version tags, gated on a
# green test suite, and publishes the CLI zips + SHA256SUMS to a real GitHub Release on tag push
# (absorbs the deleted T-F120 — this is now the only planned CLI-Release publication path).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # T-F129: manual-only trigger for build-store-msix (Store-submission packages, signed with the
  # reserved Partner Center Publisher identity instead of the tester-facing "CN=Pakko Dev" cert).
  # Deliberately not tied to push/tags -- a real Store submission is a deliberate, occasional act,
  # not something that should fire on every commit the way the tester release pipeline does.
  workflow_dispatch:

# T-F366: a newer push to a branch (or PR) cancels the run it supersedes. A tag push or a dispatch
# gets a group of its own (run_id): one shared group would still queue them, and a third arrival
# cancels the pending one. A superseded main run may be cancelled mid deploy-pages; the newer run
# deploys again.
concurrency:
  group: ${{ github.workflow }}-${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: true

# ── Interim signing identity (T-F122) ──────────────────────────────────────────────────────────
# Signs with the same local self-signed "CN=Pakko Dev" dev cert Deploy.ps1 already uses
# (thumbprint below), stored as two repo secrets. TODO(T-F10): once SignPath Foundation issues a
# real cert, swap PAKKO_DEV_CERT_PFX_BASE64 / PAKKO_DEV_CERT_PASSWORD for the new cert's export
# and update PAKKO_DEV_CERT_THUMBPRINT below — nothing else in this file should need to change.
#   PAKKO_DEV_CERT_PFX_BASE64 (secret) — base64-encoded, password-protected PFX export
#   PAKKO_DEV_CERT_PASSWORD   (secret) — the PFX export password
#
# ── Store-submission signing identity (T-F129) ─────────────────────────────────────────────────
# build-store-msix (workflow_dispatch only) signs with a second, separate self-signed cert whose
# Subject is the reserved Partner Center Publisher identity itself
# (CN=EF3EC84C-8287-4FC3-BB4F-FCCEBA116BCE) -- NOT the "CN=Pakko Dev" cert above. dotnet publish's
# MSIX packaging rewrites the built package's Identity/Publisher to match whatever cert signs it,
# so a package signed with "CN=Pakko Dev" ships with the wrong Publisher and Partner Center
# rejects it outright (confirmed 2026-08-01 against a real submission -- see docs/TASKS.md's
# T-F129 entry and scripts/Setup-StoreCert.ps1's own header). Local machines are for dev/test
# builds only now -- every package actually uploaded to Partner Center should come from this job.
#   PAKKO_STORE_CERT_PFX_BASE64  (secret) — base64-encoded, password-protected PFX export
#   PAKKO_STORE_CERT_PASSWORD    (secret) — the PFX export password
#
# ── SonarCloud (T-F135) ────────────────────────────────────────────────────────────────────────
#   SONAR_TOKEN (secret) — SonarCloud analysis token, OSS plan (public repo), org key
#   "pakkoapp-oss-1" (note the "-1" — the plain "pakkoapp-oss" key was already taken on
#   sonarcloud.io, so this is NOT the same string as the GitHub org/account name). Confirmed real
#   via SonarCloud's public API (api/components/show?component=pakkoapp-oss-1_pakko) 2026-07-27.
env:
  PAKKO_DEV_CERT_THUMBPRINT: D2EC5F2C451ED0EBE94B8168A68E5B813954CC75
  PAKKO_STORE_CERT_THUMBPRINT: CD8DE1646CBF5A52046001FB32B0B60B797E7497
  SONAR_PROJECT_KEY: pakkoapp-oss-1_pakko
  SONAR_ORGANIZATION: pakkoapp-oss-1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# test/build-cli/release stay on `windows-latest` (currently the windows-2025 image) -- it's
# confirmed green there (3 consecutive runs). build-msix and build-store-msix both pin
# `windows-2022` explicitly (T-F122, 2026-07-19; extended to build-store-msix at T-F129):
# Archiver.ShellExtension.vcxproj pins PlatformToolset=v143, and
# windows-2025's preinstalled VS has a newer default ARM64 toolset but not the ARM64 variant of
# v143 specifically, so the ARM64 leg failed there with MSB8020 (confirmed after three failed
# attempts to install the missing v143 ARM64 component via vs_installer.exe -- it kept reporting
# success near-instantly without doing real work, because the *2026* toolset's ARM64 component
# was already present, just not v143's). windows-2022 ships the ARM64 v143 toolset out of the
# box, so build-msix needs no extra install step there.
#
# Pinning windows-2022 for *every* job (an earlier version of this fix) was reverted: doing so
# also moved the `test` job there, and Archiver.Core.Tests' TarSignatureVerifier.Verify(tar.exe)
# (a native WinVerifyTrust/CryptQueryObject P/Invoke check, see that class's own doc comment)
# started returning false specifically on windows-2022, even though plain PowerShell
# Get-AuthenticodeSignature on the exact same file on the exact same runner reports a genuinely
# valid Microsoft signature. That's a real, separate, unresolved discrepancy in this project's own
# native verification code across Windows Server 2022 vs. 2025/11 -- worth its own investigation
# (not a CI-infra problem), but out of scope for T-F122. Keeping `test` on windows-latest sidesteps
# it entirely for now, since build-msix is the only job that actually needs windows-2022.
jobs:
  # T-F143 (SonarCloud S8264): `contents: read` is declared here at job level instead of at
  # workflow level (which used to apply to this job by default) — every other job in this file
  # already declares its own job-level permissions, so this was the one job actually relying on
  # the removed workflow-level default. All this job does is checkout + build + test + a SonarCloud
  # analysis upload, none of which need more than read access to repo contents.
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarCloud wants real git history (blame/new-code detection), not the default
          # single-commit shallow clone.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          # T-F364: the exact SDK from global.json - the lock files carry its ILCompiler version.
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # ── SonarCloud (T-F135) ──────────────────────────────────────────────────────────────────
      # Only runs with a real SONAR_TOKEN available: pushes to main/tags, and PRs from this same
      # repo (not forks — GitHub withholds secrets from fork-originated pull_request runs, so a
      # fork PR would otherwise fail here with a confusing missing-token error instead of just
      # skipping cleanly). Dependabot PRs are excluded too — GitHub withholds repo secrets from
      # them the same way even though they aren't forks (confirmed via a real failed run).
      - name: Set up JDK (required by dotnet-sonarscanner)
        if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache SonarCloud packages
        if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
        uses: actions/cache@v6
        with:
          path: ~\.sonar\cache
          key: ${{ runner.os }}-sonar

      - name: Install dotnet-sonarscanner
        if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
        shell: pwsh
        run: dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner

      - name: Begin SonarCloud analysis
        if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if (-not $env:SONAR_TOKEN) {
            throw "SONAR_TOKEN secret is not set. See scripts/README.md's Continuous Integration section."
          }
          # T-F149: sonar.coverage.exclusions removes these paths from the coverage denominator
          # only -- they stay fully analyzed for code smells/bugs/vulnerabilities, same as every
          # other file (this is NOT sonar.exclusions, which would drop them from analysis
          # entirely). All four are genuinely unreachable by coverlet, not just untested:
          # Archiver.Shell/Program.cs and NativeProgressDialog.cs drive a real COM IProgressDialog
          # (CLAUDE.md's "Known test gaps" already names NativeProgressDialog explicitly),
          # ExplorerLauncher.cs opens a real Explorer window (accepted uncovered by design, T-F143),
          # and Archiver.CLI/Program.cs IS exercised -- by Archiver.CLI.Tests' Subprocess/ layer,
          # which Process.Starts the real built exe -- but coverlet cannot instrument a spawned
          # child process, so those lines read as 0% despite being under real test coverage.
          # T-F268: Archiver.OperationUi/** is a WinUI window (no test host can create one; its
          # logic lives in the tested Archiver.OperationUi.Core) and HelperProcessLauncher.cs
          # starts that real exe; HelperOperationUi is tested through a fake launcher instead.
          # T-F370/T-F275: scripts/** is PowerShell and Python, which coverlet cannot measure at all
          # (the hook is run by AgentBashHookTests through pwsh).
          # See docs/CONVENTIONS.md's "SonarCloud Coverage Exclusions" section.
          .\.sonar\scanner\dotnet-sonarscanner begin `
            /k:"$env:SONAR_PROJECT_KEY" `
            /o:"$env:SONAR_ORGANIZATION" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.cs.cobertura.reportsPaths="**/coverage.cobertura.xml" `
            /d:sonar.coverage.exclusions="src/Archiver.Shell/Program.cs,src/Archiver.Shell/NativeProgressDialog.cs,src/Archiver.Core/Services/ExplorerLauncher.cs,src/Archiver.CLI/Program.cs,src/Archiver.OperationUi/**,src/Archiver.Shell/HelperProcessLauncher.cs,scripts/**"

      # T-F275: the PAR2 tools the recovery-data tests check Pakko against (GPL, so downloaded,
      # never committed; the script pins each zip's SHA-256). PAKKO_PAR2_ORACLES_REQUIRED=1 on the
      # test step makes a missing tool fail its tests instead of skipping them.
      - name: Download PAR2 test oracles (2 attempts)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $attempts = 2
          for ($i = 1; $i -le $attempts; $i++) {
            if ($i -gt 1) {
              Write-Output "::warning title=Retried::Download PAR2 test oracles (2 attempts): attempt $($i - 1) failed, retrying"
              Start-Sleep -Seconds 15
            }
            try { & ./scripts/Get-Par2Oracles.ps1; exit 0 } catch { Write-Output $_ }
          }
          throw "PAR2 oracle download failed after $attempts attempt(s)."

      - name: Run .NET test suite
        # --collect:"XPlat Code Coverage" uses the coverlet.collector package already referenced
        # by every test project (T-F135) — no new package, just feeds SonarCloud's
        # "New code has sufficient test coverage" quality-gate condition instead of leaving it at
        # "no data". Writes one coverage.cobertura.xml per test project under **/TestResults/.
        run: dotnet test --filter "Category!=Slow&Category!=VeryLarge" --collect:"XPlat Code Coverage"
        env:
          PAKKO_PAR2_ORACLES_REQUIRED: "1"

      - name: End SonarCloud analysis
        if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Set up NuGet
        uses: nuget/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0

      - name: Restore Archiver.ShellExtension.Tests packages
        run: nuget restore tests\Archiver.ShellExtension.Tests\Archiver.ShellExtension.Tests.vcxproj -SolutionDirectory .

      - name: Build Archiver.ShellExtension.Tests
        run: msbuild tests\Archiver.ShellExtension.Tests\Archiver.ShellExtension.Tests.vcxproj /p:SolutionDir=${{ github.workspace }}\ /p:Configuration=Debug /p:Platform=x64

      - name: Run Archiver.ShellExtension.Tests
        shell: pwsh
        run: |
          & "tests\Archiver.ShellExtension.Tests\bin\x64\Debug\Archiver.ShellExtension.Tests.exe"
          if ($LASTEXITCODE -ne 0) { throw "Archiver.ShellExtension.Tests failed (exit $LASTEXITCODE)" }

  # T-F150: PowerShell has no compiled build step, so its static-analysis gate lives here instead
  # of inside a .vcxproj/.csproj (see docs/DECISIONS.md's T-F150 entry). No dependency on `test` —
  # this is fast and independent, so it runs in parallel rather than waiting.
  lint-ps1:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Ensure PSScriptAnalyzer is available
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          }

      - name: Run PSScriptAnalyzer against scripts/*.ps1
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Settings scripts\PSScriptAnalyzerSettings.psd1
          if ($results.Count -gt 0) {
            $results | Format-Table -AutoSize | Out-String | Write-Output
            throw "PSScriptAnalyzer found $($results.Count) finding(s) in scripts/*.ps1 — fix or add a documented exclusion to scripts\PSScriptAnalyzerSettings.psd1."
          }
          Write-Output "PSScriptAnalyzer: 0 findings."

  # T-F365: a CycloneDX SBOM per shipped artifact (both MSIX, both CLI zips). The generator is a
  # third-party tool, so it runs here, with read-only contents and no secrets; build-msix and
  # build-cli, which hold the signing key and the OIDC token, only run the first-party
  # actions/attest on the result. Locked restore = the same package graph those jobs build.
  sbom:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No NuGet cache here: its key is shared with build-msix/build-cli, and a job that saves it
      # could leave files in the package folder those jobs then build from.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Write the SBOMs
        shell: pwsh
        run: |
          $version = if ("${{ github.ref }}".StartsWith("refs/tags/v")) { "${{ github.ref_name }}".TrimStart('v') } else { "0.0.0-dev+" + "${{ github.sha }}".Substring(0, 7) }
          foreach ($arch in 'x64', 'arm64') {
            ./scripts/New-Sbom.ps1 -Artifact Msix -Architecture $arch -Version $version -OutputPath "artifacts/sbom/pakko-msix-$arch.cdx.json"
            ./scripts/New-Sbom.ps1 -Artifact Cli -Architecture $arch -Version $version -OutputPath "artifacts/sbom/pakko-win-$arch.cdx.json"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: pakko-sbom
          path: artifacts/sbom/*.cdx.json
          if-no-files-found: error

  build-msix:
    needs: [test, lint-ps1, sbom]
    if: github.event_name == 'push'
    runs-on: windows-2022
    timeout-minutes: 30
    # T-F364: deterministic source paths (/_/) in the shipped binaries and PDBs; not in `test`,
    # whose coverage report needs the real source paths.
    env:
      ContinuousIntegrationBuild: true
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    # T-F125: id-token/attestations grant a signed SLSA build-provenance attestation via
    # actions/attest-build-provenance below — no new secret involved, unrelated to the
    # PAKKO_DEV_CERT_* Authenticode signing above (see that block's own comment / T-F10).
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # T-F364: the exact SDK from global.json - the lock files carry its ILCompiler version.
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Import signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.PAKKO_DEV_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.PAKKO_DEV_CERT_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) {
            throw "PAKKO_DEV_CERT_PFX_BASE64 / PAKKO_DEV_CERT_PASSWORD secrets are not set. See scripts/README.md's Continuous Integration section."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "PakkoDev.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
          $securePassword = ConvertTo-SecureString -String $env:PFX_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword | Out-Null
          Remove-Item $pfxPath -Force

      - name: Build and sign MSIX
        shell: pwsh
        run: |
          # T-F317: the packaged pakko.exe prints the release on a tag, like build-cli's zip.
          $cliVersion = if ("${{ github.ref }}".StartsWith("refs/tags/v")) { "${{ github.ref_name }}".TrimStart('v') } else { '' }
          .\scripts\CI-Build-Msix.ps1 -Architecture ${{ matrix.architecture }} -Thumbprint $env:PAKKO_DEV_CERT_THUMBPRINT -MsBuildPath msbuild -CliVersion $cliVersion

      - name: Attest build provenance (SLSA, T-F125)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            src/Archiver.App/AppPackages/**/*.msix
            src/Archiver.App/AppPackages/**/*.msixbundle

      - uses: actions/download-artifact@v8
        with:
          name: pakko-sbom
          path: artifacts/sbom

      - name: Attest the SBOM (CycloneDX, T-F365)
        uses: actions/attest@v4
        with:
          subject-path: |
            src/Archiver.App/AppPackages/**/*.msix
            src/Archiver.App/AppPackages/**/*.msixbundle
          sbom-path: artifacts/sbom/pakko-msix-${{ matrix.architecture }}.cdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: pakko-msix-${{ matrix.architecture }}
          path: |
            src/Archiver.App/AppPackages/**/*.msix
            src/Archiver.App/AppPackages/**/*.msixbundle
          if-no-files-found: error

      # T-F355: the four AOT exes' native symbols, kept for reading crash dumps; not released.
      - uses: actions/upload-artifact@v7
        with:
          name: pakko-pdb-${{ matrix.architecture }}
          path: artifacts/pdb/${{ matrix.architecture }}/*.pdb
          if-no-files-found: error

  # T-F129: Store-submission MSIX, signed with the reserved Partner Center Publisher identity.
  # Manual-only (workflow_dispatch) -- run this from the Actions tab against the tag/ref you're
  # about to submit, download both architecture legs' artifacts, and upload them together to
  # Partner Center. Not attached to any GitHub Release: a different Publisher than the public
  # tester build would be confusing to end users, and this is meant for Partner Center upload
  # only (Microsoft re-signs for real distribution).
  build-store-msix:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 30
    # T-F364: deterministic source paths (/_/) in the shipped binaries and PDBs; not in `test`,
    # whose coverage report needs the real source paths.
    env:
      ContinuousIntegrationBuild: true
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # T-F364: the exact SDK from global.json - the lock files carry its ILCompiler version.
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Import Store signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.PAKKO_STORE_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.PAKKO_STORE_CERT_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) {
            throw "PAKKO_STORE_CERT_PFX_BASE64 / PAKKO_STORE_CERT_PASSWORD secrets are not set. See scripts/README.md's Continuous Integration section."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "PakkoStore.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
          $securePassword = ConvertTo-SecureString -String $env:PFX_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword | Out-Null
          Remove-Item $pfxPath -Force

      - name: Build and sign Store MSIX
        shell: pwsh
        run: |
          # T-F317: the packaged pakko.exe prints the release on a tag, like build-cli's zip.
          $cliVersion = if ("${{ github.ref }}".StartsWith("refs/tags/v")) { "${{ github.ref_name }}".TrimStart('v') } else { '' }
          .\scripts\CI-Build-Msix.ps1 -Architecture ${{ matrix.architecture }} -Thumbprint $env:PAKKO_STORE_CERT_THUMBPRINT -MsBuildPath msbuild -CliVersion $cliVersion

      - uses: actions/upload-artifact@v7
        with:
          name: pakko-store-msix-${{ matrix.architecture }}
          path: |
            src/Archiver.App/AppPackages/**/*.msix
            src/Archiver.App/AppPackages/**/*.msixbundle
          if-no-files-found: error

  # T-F129: merges build-store-msix's two single-architecture bundles into one real multi-arch
  # bundle. A .msixbundle's own Identity carries no ProcessorArchitecture (only its inner
  # packages do) -- so two *separate* single-arch bundles both compute to the exact same full
  # package name ("..._Neutral_...") despite having different contents, and Partner Center
  # rejects the upload outright ("must be uniquely identified by their full names"). Confirmed
  # against a real submission, 2026-08-01. The fix is a single bundle listing both
  # <Package Architecture="x64"> and <Package Architecture="arm64"> entries -- this is also
  # Microsoft's own documented shape for a multi-architecture Store app.
  bundle-store-msix:
    needs: build-store-msix
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pakko-store-msix-x64
          path: artifacts/store-x64

      - uses: actions/download-artifact@v8
        with:
          name: pakko-store-msix-arm64
          path: artifacts/store-arm64

      - name: Import Store signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.PAKKO_STORE_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.PAKKO_STORE_CERT_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) {
            throw "PAKKO_STORE_CERT_PFX_BASE64 / PAKKO_STORE_CERT_PASSWORD secrets are not set. See scripts/README.md's Continuous Integration section."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "PakkoStore.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
          $securePassword = ConvertTo-SecureString -String $env:PFX_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword | Out-Null
          # Also trust it (LocalMachine\TrustedPeople) -- unlike build-store-msix, this job calls
          # Get-AuthenticodeSignature as a hard gate after re-signing, and Status only reports
          # 'Valid' for a chain the machine actually trusts, not merely a well-formed signature.
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $securePassword | Out-Null
          Remove-Item $pfxPath -Force

      - name: Unbundle, merge, and re-sign
        shell: pwsh
        run: |
          $sdkBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $makeappx = Get-ChildItem $sdkBin -Recurse -Filter "makeappx.exe" | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1 -ExpandProperty FullName
          $signtool  = Get-ChildItem $sdkBin -Recurse -Filter "signtool.exe"  | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeappx -or -not $signtool) { throw "makeappx.exe/signtool.exe not found under $sdkBin" }

          $x64Bundle   = Get-ChildItem artifacts/store-x64   -Recurse -Filter "*.msixbundle" | Select-Object -First 1 -ExpandProperty FullName
          $arm64Bundle = Get-ChildItem artifacts/store-arm64 -Recurse -Filter "*.msixbundle" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $x64Bundle -or -not $arm64Bundle) { throw "Expected one .msixbundle per architecture artifact." }

          & $makeappx unbundle /p $x64Bundle   /d unbundled-x64
          & $makeappx unbundle /p $arm64Bundle /d unbundled-arm64
          if ($LASTEXITCODE -ne 0) { throw "makeappx unbundle failed (exit $LASTEXITCODE)." }

          New-Item -ItemType Directory -Path combined -Force | Out-Null
          Get-ChildItem unbundled-x64   -Filter "*.msix" | Copy-Item -Destination combined
          Get-ChildItem unbundled-arm64 -Filter "*.msix" | Copy-Item -Destination combined

          # Read the real app version out of one of the just-built packages rather than
          # hardcoding it, so this job never needs editing on a version bump.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $innerMsix = Get-ChildItem combined -Filter "*_x64.msix" | Select-Object -First 1 -ExpandProperty FullName
          $zip = [System.IO.Compression.ZipFile]::OpenRead($innerMsix)
          $entry = $zip.Entries | Where-Object { $_.Name -eq 'AppxManifest.xml' }
          $reader = New-Object System.IO.StreamReader($entry.Open())
          $manifestText = $reader.ReadToEnd()
          $reader.Close()
          $zip.Dispose()
          $versionMatch = [regex]::Match($manifestText, 'Version="(\d+\.\d+\.\d+\.\d+)"')
          if (-not $versionMatch.Success) { throw "Could not read Version from $innerMsix's AppxManifest.xml." }
          $appVersion = $versionMatch.Groups[1].Value
          Write-Host "App version: $appVersion"

          $outBundle = "Archiver.App_${appVersion}.msixbundle"
          & $makeappx bundle /d combined /p $outBundle /bv $appVersion
          if ($LASTEXITCODE -ne 0) { throw "makeappx bundle failed (exit $LASTEXITCODE)." }

          & $signtool sign /fd SHA256 /sha1 $env:PAKKO_STORE_CERT_THUMBPRINT $outBundle
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed (exit $LASTEXITCODE)." }

          $sig = Get-AuthenticodeSignature -FilePath $outBundle
          if ($sig.Status -ne 'Valid') { throw "Merged bundle signature is $($sig.Status), not Valid." }

          New-Item -ItemType Directory -Path out -Force | Out-Null
          Move-Item $outBundle out/

      - uses: actions/upload-artifact@v7
        with:
          name: pakko-store-msixbundle
          path: out/*.msixbundle
          if-no-files-found: error

  build-cli:
    needs: [test, sbom]
    if: github.event_name == 'push'
    # T-F355: not windows-2022 like build-msix - this job runs the Subprocess layer, and on that
    # image tar.exe carries no embedded Authenticode signature, which TarSignatureVerifier requires,
    # so every tar test fails there. The AOT ARM64 link uses the image's latest VS ARM64 tools.
    runs-on: windows-latest
    timeout-minutes: 20
    # T-F364: deterministic source paths (/_/) in the shipped binaries and PDBs; not in `test`,
    # whose coverage report needs the real source paths.
    env:
      ContinuousIntegrationBuild: true
    # T-F125: see build-msix's identical permissions comment above.
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # T-F364: the exact SDK from global.json - the lock files carry its ILCompiler version.
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Publish pakko.exe (both architectures)
        shell: pwsh
        run: |
          # On a version-tag push, stamp the exact tag (minus the leading "v") into the built
          # exe so `pakko --version` always matches the GitHub Release it shipped under, even if
          # Archiver.CLI.csproj keeps a fixed 0.0.0-dev version (T-F222); other builds print it plus the commit.
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            .\scripts\Publish-Cli.ps1 -Version "${{ github.ref_name }}".TrimStart('v')
          } else {
            .\scripts\Publish-Cli.ps1
          }

      # T-F355: dotnet test (the test job) runs under JIT and cannot see an AOT-only failure; this
      # runs the Subprocess layer against the native x64 pakko.exe just published. Skipped on a tag:
      # its exe prints the release version, not the dev pattern the -v tests expect, and the same
      # commit already passed here when it was pushed to main.
      - name: Subprocess tests against the Native AOT pakko.exe
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          $env:PAKKO_CLI_EXE = Join-Path $PWD 'artifacts\cli\win-x64\pakko.exe'
          $attempts = 2
          for ($i = 1; $i -le $attempts; $i++) {
            if ($i -gt 1) {
              Write-Output "::warning title=Retried::Subprocess tests against the Native AOT pakko.exe: attempt $($i - 1) failed, retrying"
              Start-Sleep -Seconds 15
            }
            dotnet test tests/Archiver.CLI.Tests --filter "FullyQualifiedName~Subprocess"
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          throw "Subprocess tests against the AOT pakko.exe failed after $attempts attempt(s)."

      - name: Attest build provenance (SLSA, T-F125)
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: artifacts/cli/SHA256SUMS

      - uses: actions/download-artifact@v8
        with:
          name: pakko-sbom
          path: artifacts/sbom

      - name: Attest the x64 SBOM (CycloneDX, T-F365)
        uses: actions/attest@v4
        with:
          subject-path: artifacts/cli/pakko-win-x64.zip
          sbom-path: artifacts/sbom/pakko-win-x64.cdx.json

      - name: Attest the arm64 SBOM (CycloneDX, T-F365)
        uses: actions/attest@v4
        with:
          subject-path: artifacts/cli/pakko-win-arm64.zip
          sbom-path: artifacts/sbom/pakko-win-arm64.cdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: pakko-cli
          path: artifacts/cli/**
          if-no-files-found: error

  release:
    needs: [build-msix, build-cli]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: pakko-cli
          path: artifacts/cli

      # T-F126: pakko-msix-x64 / pakko-msix-arm64 (from build-msix's matrix legs) merged into one
      # directory -- each still nested under its original src/Archiver.App/AppPackages/... path.
      - uses: actions/download-artifact@v8
        with:
          pattern: pakko-msix-*
          path: artifacts/msix
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: pakko-sbom
          path: artifacts/sbom

      # Prepends this tag's own CHANGELOG.md section (if one exists) ahead of the static
      # download-instructions template, so a GitHub Release's own notes actually say what
      # changed instead of only how to install it -- CHANGELOG.md previously had no path into
      # the release notes body at all (found 2026-08-04: every prior release's notes were the
      # template only). CHANGELOG.md sections are separated by a bare "---" line and each starts
      # "## v<version> -- <date>"; matched against github.ref_name so this never needs editing
      # per release. Missing a section (e.g. a tag CHANGELOG.md was never updated for) falls
      # back to the template alone rather than failing the release.
      - name: Build release notes (CHANGELOG.md section + download template)
        shell: pwsh
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $tag = "${{ github.ref_name }}"
          $sections = [regex]::Split($changelog, '(?m)^---\s*$')
          $escapedTag = [regex]::Escape($tag)
          $section = $sections | Where-Object { $_ -match "(?m)^##\s+$escapedTag\s+—" } | Select-Object -First 1
          $template = Get-Content .github/RELEASE_NOTES_TEMPLATE.md -Raw
          if (-not $section) {
            Write-Warning "No CHANGELOG.md section found for '$tag' -- release notes will use the download template only."
            $notesBody = $template
          } else {
            $notesBody = $section.Trim() + "`n`n---`n`n" + $template
          }
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notesPath -Value $notesBody -NoNewline
          "NOTES_PATH=$notesPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msixAssets = Get-ChildItem -Path artifacts/msix -Recurse -Include *.msix, *.msixbundle | Select-Object -ExpandProperty FullName
          if (-not $msixAssets) {
            throw "No .msix/.msixbundle files found under artifacts/msix -- build-msix artifacts missing or layout changed."
          }
          $assets = @(
            "artifacts/cli/pakko-win-x64.zip",
            "artifacts/cli/pakko-win-arm64.zip",
            "artifacts/cli/SHA256SUMS"
          ) + $msixAssets
          # T-F365: the four CycloneDX SBOMs, each attested against its artifact.
          $sbomAssets = Get-ChildItem -Path artifacts/sbom -Filter *.cdx.json | Select-Object -ExpandProperty FullName
          if (@($sbomAssets).Count -ne 4) {
            throw "Expected 4 SBOMs under artifacts/sbom, found $(@($sbomAssets).Count)."
          }
          $assets += $sbomAssets
          gh release create "${{ github.ref_name }}" @assets `
            --title "${{ github.ref_name }}" `
            --notes-file $env:NOTES_PATH

      # T-F317: the winget manifest for this release's CLI zips, from the same SHA256SUMS. Kept as
      # an artifact only -- submitting it to microsoft/winget-pkgs is a manual step
      # (scripts/README.md), since it publishes under the project's name. Not for a prerelease tag
      # (vX.Y.Z-rc.N): winget-pkgs takes releases only, and the script accepts X.Y.Z only.
      - name: Write winget manifest
        if: ${{ !contains(github.ref_name, '-') }}
        shell: pwsh
        run: |
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          .\scripts\New-WingetManifest.ps1 -Version "${{ github.ref_name }}".TrimStart('v') -Sha256SumsPath artifacts/cli/SHA256SUMS -ReleaseDate $date -OutputRoot artifacts/winget

      - uses: actions/upload-artifact@v7
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          name: pakko-winget-manifest
          path: artifacts/winget/

  # DocFX developer/API docs site (docfx.json at repo root -- see index.md/toc.yml/api/index.md
  # for the book+API structure). runs-on: ubuntu-latest, unlike every other job in this file --
  # Archiver.Core and Archiver.App.Core are both plain net10.0 with zero WinUI/Windows-only deps
  # (a repo hard constraint already, for unrelated reasons), so docfx's design-time build of them
  # is genuinely portable and doesn't need a Windows runner's licensing cost.
  docs:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # T-F364: the exact SDK from global.json - the lock files carry its ILCompiler version.
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - uses: actions/configure-pages@v6

      - name: Restore local dotnet tools (docfx)
        run: dotnet tool restore

      - name: Build DocFX site
        run: dotnet docfx docfx.json

      # Assembles the real Pages artifact: the existing hand-authored static site (docs/index.html
      # and friends) copied verbatim, unchanged, plus the freshly built DocFX site under dev/. An
      # explicit allowlist, not `cp -r docs/*` -- docs/ also holds TASKS.md/TASKS_DONE.md/
      # DECISIONS.md (hundreds of KB of internal working notes) that must never land on the live
      # public site root.
      - name: Assemble Pages artifact
        run: |
          set -euo pipefail
          mkdir -p _pages/uk _pages/assets _pages/dev
          cp docs/index.html docs/privacy.html docs/sitemap.xml docs/googlec78fa6674eb7667f.html _pages/
          cp -r docs/uk/. _pages/uk/
          cp -r docs/assets/. _pages/assets/
          cp -r _site/. _pages/dev/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _pages

  # Separate job (not a step in `docs`) per GitHub's own required Pages-deployment pattern --
  # actions/deploy-pages needs the `pages: write` / `id-token: write` permissions and the
  # `github-pages` environment, which stay scoped to this job alone rather than widening `docs`'s
  # own permissions unnecessarily.
  deploy-pages:
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
