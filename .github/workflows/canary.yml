name: Canary

# T-F187: daily build on a deliberately FLOATING toolchain (unlike build.yml's pinned
# windows-2022/v143) to catch SDK/NuGet/MSVC drift before build.yml's own pin eventually needs
# bumping -- the same class of break T-F122 already hit once (windows-latest silently relabeled
# windows-2022 -> windows-2025 mid-project and broke the ARM64 leg).
#
# 3-day escalation, no crying wolf on a single bad day: canary-dotnet/canary-shellext mask every
# step's real pass/fail behind `continue-on-error: true` (so a transient network/runner blip is
# retried in-run and never reddens the workflow by itself) and report their true result as a job
# output instead. canary-status always exits 0 -- it only ever computes and outputs `today_failed`
# and, if today failed, the real consecutive-failure `streak` (reconstructed from real history via
# canary-failed-day, a trivial sentinel job that only runs when today failed, so its own recorded
# conclusion -- success = failed that day, skipped = didn't -- across past runs IS the persisted
# state). canary-alert is the only escalation job allowed to actually fail: streak < 3 -> it exits 0 with a
# `::warning::` only (no red X, no email); streak >= 3 -> it exits 1 for real (GitHub's default
# failure email) and creates/updates one de-duplicated tracking Issue, closed automatically on the
# next green run. Deliberately keeping canary-status itself always-green (rather than having it
# both compute the streak AND be the job that fails) sidesteps an unresolved question about
# whether a failed job's own `outputs` reliably propagate to jobs that `needs` it -- see
# docs/DECISIONS.md's T-F187 entry for the full account, including why the streak can't simply be
# read off the workflow run's own conclusion (it's the exact thing being masked).
#
# ARM64 is deliberately out of scope for canary-shellext: Archiver.ShellExtension.vcxproj
# hardcodes PlatformToolset=v143, and build.yml's own header comment already documents that
# windows-latest's current image lacks the ARM64 v143 variant (MSB8020, confirmed unfixable after
# three attempts, T-F122). Escalating that here would open a tracking Issue that could never
# auto-close, since the cause isn't transient. That gap stays tracked only via build.yml/T-F122.
#
# T-F240: no longer drift-only. The nightly run also carries the checks too slow or too
# specialized for every push -- `Category=Slow` without the timing-ratio classes (canary-slow), the .NET suite on a real ARM64
# runner (canary-arm64), the C++ tests under MSVC AddressSanitizer (canary-asan) -- under the same
# masked 3-day escalation, and a fuzzing run (canary-fuzz) that is NOT masked: it sits outside
# canary-status's `needs`, fails red on the first bad night and uploads the failing inputs, since
# a fuzz finding is a real bug, not a transient. canary-alert and canary-fuzz are the two jobs
# allowed to fail. Release checklist: CLAUDE.md's "Deployment" section.
on:
  schedule:
    # Deliberately not top-of-hour -- GitHub's own scheduling docs note :00 is the most delayed/
    # contended slot for scheduled workflows.
    - cron: "17 6 * * *"
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  canary-dotnet:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.record.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        id: checkout

      - uses: actions/setup-dotnet@v6
        continue-on-error: true
        id: setup_dotnet
        with:
          dotnet-version: "10.0.x"

      # Same command as build.yml's own `test` job -- `dotnet test` builds first, so no separate
      # `dotnet build` step is needed. Retried once (matches this repo's own documented
      # occasional cross-project TarSandbox-contention flakiness) before counting as a real
      # failure; each attempt runs the full suite fresh rather than reusing `--no-build` state.
      - name: Run .NET test suite (2 attempts)
        id: build_test
        continue-on-error: true
        shell: pwsh
        run: |
          $attempts = 2
          for ($i = 1; $i -le $attempts; $i++) {
            if ($i -gt 1) { Start-Sleep -Seconds 15 }
            dotnet test --filter "Category!=Slow&Category!=VeryLarge"
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          throw "dotnet test failed after $attempts attempt(s)."

      - name: Record result
        id: record
        if: always()
        shell: pwsh
        run: |
          $outcomes = @('${{ steps.checkout.outcome }}', '${{ steps.setup_dotnet.outcome }}', '${{ steps.build_test.outcome }}')
          $failed = ($outcomes -contains 'failure') -or ($outcomes -contains 'cancelled')
          "failed=$($failed.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  canary-shellext:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.record.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        id: checkout

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
        continue-on-error: true
        id: setup_msbuild

      # x64 only -- see this file's header comment for why ARM64 is deliberately excluded.
      # /p:SolutionDir is required (not auto-set outside a real .sln build, same as CLAUDE.md's
      # Build Commands note for the Tests project) since the vcxproj's OutDir/IntDir reference it.
      - name: Build Archiver.ShellExtension (x64, 2 attempts)
        id: build_x64
        continue-on-error: true
        shell: pwsh
        run: |
          $msbuildArgs = @(
            "src\Archiver.ShellExtension\Archiver.ShellExtension.vcxproj",
            "/p:SolutionDir=${{ github.workspace }}\",
            "/p:Configuration=Debug",
            "/p:Platform=x64"
          )
          $attempts = 2
          for ($i = 1; $i -le $attempts; $i++) {
            if ($i -gt 1) { Start-Sleep -Seconds 15 }
            # $currentArgs, not $args -- $args is a PowerShell automatic variable; reusing it
            # here would shadow a reserved name for no benefit.
            $currentArgs = $msbuildArgs
            if ($i -gt 1) { $currentArgs += "/t:Rebuild" }
            msbuild @currentArgs
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          throw "Archiver.ShellExtension x64 build failed after $attempts attempt(s)."

      - name: Record result
        id: record
        if: always()
        shell: pwsh
        run: |
          $outcomes = @('${{ steps.checkout.outcome }}', '${{ steps.setup_msbuild.outcome }}', '${{ steps.build_x64.outcome }}')
          $failed = ($outcomes -contains 'failure') -or ($outcomes -contains 'cancelled')
          "failed=$($failed.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  # T-F240: Zip64 and the other Slow checks -- real multi-second cost, too slow for every push.
  # Same masked shape as canary-dotnet. The 7za timing ratios (CompressionPerformanceTests,
  # HashPerformanceTests) are left out: a shared runner measured Hybrid at 5.23 against a 3.9
  # ceiling. ZipSandboxSpikePerformanceTests needs a locally published spike exe. Both stay in the
  # local `Category=Slow` run before a release.
  canary-slow:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.record.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        id: checkout

      - uses: actions/setup-dotnet@v6
        continue-on-error: true
        id: setup_dotnet
        with:
          dotnet-version: "10.0.x"

      - name: Run Category=Slow tests (2 attempts)
        id: slow_test
        continue-on-error: true
        shell: pwsh
        run: |
          $attempts = 2
          for ($i = 1; $i -le $attempts; $i++) {
            if ($i -gt 1) { Start-Sleep -Seconds 15 }
            dotnet test --filter "Category=Slow&FullyQualifiedName!~CompressionPerformanceTests&FullyQualifiedName!~HashPerformanceTests&FullyQualifiedName!~ZipSandboxSpikePerformanceTests"
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          throw "Category=Slow tests failed after $attempts attempt(s)."

      - name: Record result
        id: record
        if: always()
        shell: pwsh
        run: |
          $outcomes = @('${{ steps.checkout.outcome }}', '${{ steps.setup_dotnet.outcome }}', '${{ steps.slow_test.outcome }}')
          $failed = ($outcomes -contains 'failure') -or ($outcomes -contains 'cancelled')
          "failed=$($failed.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  # T-F240: the ARM64 CLI and MSIX are built on every push but their tests never ran on ARM64.
  # The default filter's PerformanceTests have no timing assertions, and SevenZipRunner picks the
  # vendored arm64 7za.exe by process architecture.
  canary-arm64:
    runs-on: windows-11-arm
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.record.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        id: checkout

      - uses: actions/setup-dotnet@v6
        continue-on-error: true
        id: setup_dotnet
        with:
          dotnet-version: "10.0.x"

      - name: Run .NET test suite on ARM64 (2 attempts)
        id: build_test
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "Process architecture: $([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"
          $attempts = 2
          for ($i = 1; $i -le $attempts; $i++) {
            if ($i -gt 1) { Start-Sleep -Seconds 15 }
            dotnet test --filter "Category!=Slow&Category!=VeryLarge"
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          throw "dotnet test on ARM64 failed after $attempts attempt(s)."

      # T-F290: diagnostic only, never part of the result -- which names the OS tar.exe survives.
      - name: tar.exe name probe
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -Namespace Probe -Name Cp -MemberDefinition '[DllImport("kernel32.dll")] public static extern uint GetACP(); [DllImport("kernel32.dll")] public static extern uint GetOEMCP();'
          $tar = 'C:\Windows\System32\tar.exe'
          & $tar --version
          Write-Host "ACP $([Probe.Cp]::GetACP()); OEMCP $([Probe.Cp]::GetOEMCP()); culture $((Get-Culture).Name)"
          $dir = Join-Path $env:RUNNER_TEMP 'tarprobe'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Location $dir
          $out = Join-Path $env:RUNNER_TEMP 'probe.tar'
          $names = @('plain.txt', "caf$([char]0xE9).txt", "$([char]0x43F)$([char]0x440)$([char]0x438).txt")
          foreach ($n in $names) { Set-Content -LiteralPath $n -Value 'x' }
          foreach ($n in $names) {
            foreach ($flag in @('-cf', '-czf')) {
              & $tar $flag $out $n 2>&1 | Out-Host
              Write-Host "RESULT name=$n flag=$flag exit=$LASTEXITCODE"
            }
            Set-Content -LiteralPath list.txt -Value $n
            & $tar -czf $out -T list.txt 2>&1 | Out-Host
            Write-Host "RESULT name=$n flag=-czf-list exit=$LASTEXITCODE"
          }

      - name: Record result
        id: record
        if: always()
        shell: pwsh
        run: |
          $outcomes = @('${{ steps.checkout.outcome }}', '${{ steps.setup_dotnet.outcome }}', '${{ steps.build_test.outcome }}')
          $failed = ($outcomes -contains 'failure') -or ($outcomes -contains 'cancelled')
          "failed=$($failed.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  # T-F240: the C++ tests (and, through the ProjectReference, Archiver.ShellExtension.dll itself)
  # built with MSVC AddressSanitizer. Proven to fail: a deliberate heap overflow in a gtest aborted
  # with "AddressSanitizer: heap-buffer-overflow" (2026-09-29). The ASan runtime DLL is not on
  # PATH by default; it comes from the MSVC toolset the build used.
  canary-asan:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.record.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        id: checkout

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
        continue-on-error: true
        id: setup_msbuild

      - name: Set up NuGet
        uses: nuget/setup-nuget@b26b823c478ee115be5c9403e62c90b0bf943843 # v3.1.0
        continue-on-error: true
        id: setup_nuget

      - name: Build and run Archiver.ShellExtension.Tests under ASan
        id: asan_test
        continue-on-error: true
        shell: pwsh
        run: |
          nuget restore tests\Archiver.ShellExtension.Tests\Archiver.ShellExtension.Tests.vcxproj -SolutionDirectory .
          if ($LASTEXITCODE -ne 0) { throw "nuget restore failed (exit $LASTEXITCODE)" }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          # VS 2026 ships v143 as a side toolset with its own version file; VS 2022's default is v143.
          $verFile = Join-Path $vs 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.v143.default.txt'
          if (-not (Test-Path $verFile)) { $verFile = Join-Path $vs 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt' }
          $asanDir = Join-Path $vs "VC\Tools\MSVC\$((Get-Content $verFile -Raw).Trim())\bin\Hostx64\x64"
          if (-not (Test-Path (Join-Path $asanDir 'clang_rt.asan_dynamic-x86_64.dll'))) { throw "ASan runtime not found in $asanDir" }
          Write-Host "ASan runtime: $asanDir"
          msbuild tests\Archiver.ShellExtension.Tests\Archiver.ShellExtension.Tests.vcxproj "/p:SolutionDir=${{ github.workspace }}\" /p:Configuration=Debug /p:Platform=x64 /p:EnableASAN=true
          if ($LASTEXITCODE -ne 0) { throw "ASan build failed (exit $LASTEXITCODE)" }
          $env:PATH = "$asanDir;$env:PATH"
          & "tests\Archiver.ShellExtension.Tests\bin\x64\Debug\Archiver.ShellExtension.Tests.exe"
          if ($LASTEXITCODE -ne 0) { throw "Archiver.ShellExtension.Tests failed under ASan (exit $LASTEXITCODE)" }

      - name: Record result
        id: record
        if: always()
        shell: pwsh
        run: |
          $outcomes = @('${{ steps.checkout.outcome }}', '${{ steps.setup_msbuild.outcome }}', '${{ steps.setup_nuget.outcome }}', '${{ steps.asan_test.outcome }}')
          $failed = ($outcomes -contains 'failure') -or ($outcomes -contains 'cancelled')
          "failed=$($failed.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  # T-F240: deliberately NOT masked and NOT in canary-status's needs (see the header). A fresh seed
  # every night; the failure message names the seed and iteration, and the failing input is
  # uploaded. run_id exceeds int32, so it is reduced first -- FuzzRunner rejects an unparsable seed.
  canary-fuzz:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # --blame-hang-timeout is per test case (one seed archive x all iterations); a single
      # iteration is already bounded to 30 s by FuzzRunner.
      - name: Fuzz the untrusted-input parsers
        shell: pwsh
        env:
          PAKKO_FUZZ_ITERATIONS: "500"
          PAKKO_FUZZ_OUTPUT: ${{ runner.temp }}\pakko-fuzz
        run: |
          $env:PAKKO_FUZZ_SEED = [string]([long]'${{ github.run_id }}' % 2147483647)
          Write-Host "PAKKO_FUZZ_SEED=$env:PAKKO_FUZZ_SEED PAKKO_FUZZ_ITERATIONS=$env:PAKKO_FUZZ_ITERATIONS"
          dotnet test tests/Archiver.Core.Tests --filter "Category=Fuzz" --blame-crash --blame-hang-timeout 15m --results-directory "${{ runner.temp }}\fuzz-results"
          if ($LASTEXITCODE -ne 0) { throw "Fuzzing found a failure -- see the fuzz-inputs artifact." }

      - name: Upload failing inputs and dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-inputs
          path: |
            ${{ runner.temp }}\pakko-fuzz
            ${{ runner.temp }}\fuzz-results

  # Deliberately always exits 0 -- this job's outputs are consumed by canary-failed-day and
  # canary-alert below, and whether a *failed* job's outputs reliably propagate to jobs that
  # `needs` it is not something this design wants to depend on. See docs/DECISIONS.md's T-F187
  # entry for the failure mode this sidesteps.
  canary-status:
    # Every masked job goes here; the evaluation below reads them all generically (T-F240).
    needs: [canary-dotnet, canary-shellext, canary-slow, canary-arm64, canary-asan]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    outputs:
      today_failed: ${{ steps.evaluate.outputs.today_failed }}
      streak: ${{ steps.evaluate.outputs.streak }}
    env:
      GH_TOKEN: ${{ github.token }}
      TRACKING_TITLE: "CI Canary: build failing for 3+ consecutive days"
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Evaluate today's result and compute the streak
        id: evaluate
        shell: bash
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): result=\(.value.result) failed=\(.value.outputs.failed // "-")"'

          # A human-cancelled run is neither a pass nor a real failure -- don't advance or
          # reset the streak, and leave any existing tracking Issue exactly as it is.
          if echo "$NEEDS_JSON" | jq -e 'any(.[]; .result == "cancelled")' > /dev/null; then
            echo "Run was cancelled -- not counted toward the failure streak, tracking Issue left untouched."
            echo "today_failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          today_failed=$(echo "$NEEDS_JSON" | jq -r 'any(.[]; .result != "success" or .outputs.failed == "true")')
          echo "today_failed=$today_failed" >> "$GITHUB_OUTPUT"

          if [ "$today_failed" = "false" ]; then
            echo "Canary green today."
            # Only a real scheduled run closes the tracking Issue -- the streak history itself is
            # scheduled-only (see below), and a one-off workflow_dispatch happening to pass mid-
            # outage shouldn't close it prematurely (it would just reopen as a new Issue on the
            # next scheduled failure, but there's no reason to allow that churn).
            if [ "${{ github.event_name }}" = "schedule" ]; then
              existing_issue=$(gh issue list --state open --search "in:title \"$TRACKING_TITLE\"" --json number,title \
                --jq ".[] | select(.title == \"$TRACKING_TITLE\") | .number" | head -n1 || true)
              if [ -n "$existing_issue" ]; then
                gh issue close "$existing_issue" --comment "Canary is green again as of this run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                  || echo "::warning::Failed to close tracking Issue #$existing_issue -- it may need closing manually."
              fi
            fi
            exit 0
          fi

          # Reconstruct the consecutive-failure streak from canary-failed-day's own recorded
          # conclusion across past scheduled runs -- real persisted state, not the workflow run's
          # own (deliberately masked) conclusion. See this file's header comment.
          gh_api_retry() {
            local url="$1" jq_filter="$2" result
            for attempt in 1 2; do
              if result=$(gh api "$url" --jq "$jq_filter" 2>/dev/null); then
                echo "$result"
                return 0
              fi
              echo "::warning::gh api query failed (attempt $attempt): $url" >&2
              sleep 5
            done
            return 1
          }

          if ! run_ids_json=$(gh_api_retry \
              "repos/${{ github.repository }}/actions/workflows/canary.yml/runs?event=schedule&status=completed&branch=main&per_page=30" \
              '[.workflow_runs[].id]'); then
            echo "::warning::Could not determine prior canary run history -- treating today as day 1 for escalation purposes."
            echo "streak=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          streak=1
          for id in $(echo "$run_ids_json" | jq -r '.[]'); do
            concl=$(gh_api_retry "repos/${{ github.repository }}/actions/runs/$id/jobs" \
              '.jobs[] | select(.name=="canary-failed-day") | .conclusion' || echo "")
            if [ "$concl" = "success" ]; then
              streak=$((streak + 1))
            else
              break
            fi
          done

          echo "Consecutive failure streak (including today): $streak"
          echo "streak=$streak" >> "$GITHUB_OUTPUT"

  # Sentinel job, T-F187: deliberately trivial. Its own conclusion (success = ran = today failed;
  # skipped = today didn't) is what canary-status's "Evaluate" step reads back from past runs via
  # the Actions REST API to reconstruct the streak -- it is the ONE bit of state this workflow
  # persists across days, since every other signal (step/job/run conclusion) is deliberately
  # masked by continue-on-error for days 1-2. canary-status always exits 0 (see its own comment
  # above), so the default "skip if a needed job failed" gating never applies here in the first
  # place -- `always()` is kept anyway as a defensive default, matching canary-alert below.
  canary-failed-day:
    # Explicit `name:` so canary-status's jobs-API query (`select(.name=="canary-failed-day")`)
    # never depends on GitHub's un-configured default (confirmed empirically to equal the job ID
    # for a non-matrix job, but pinned explicitly here rather than relying on that continuing).
    name: canary-failed-day
    needs: canary-status
    if: always() && needs.canary-status.outputs.today_failed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record today as a failure day
        run: echo "Canary failed today -- this job's own success/skip status is read back by future runs to reconstruct the consecutive-failure streak."

  # The only escalation job allowed to actually fail (canary-fuzz fails on its own, outside the
  # escalation). Nothing downstream consumes its
  # outputs, so whether a failed job's outputs propagate correctly is a non-issue here -- unlike
  # canary-status, which deliberately never fails for exactly that reason.
  canary-alert:
    needs: [canary-status, canary-failed-day]
    if: always() && needs.canary-status.outputs.today_failed == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TRACKING_TITLE: "CI Canary: build failing for 3+ consecutive days"
    steps:
      - name: Escalate if the streak has reached 3
        shell: bash
        run: |
          set -euo pipefail
          streak="${{ needs.canary-status.outputs.streak }}"

          if [ -z "$streak" ] || [ "$streak" -lt 3 ]; then
            echo "::warning::Canary build failed today (day ${streak:-1} of 3 before escalation) -- canary-status's log lists which job failed."
            exit 0
          fi

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="Canary build has failed $streak consecutive scheduled days. Latest failing run: $run_url"
          existing_issue=$(gh issue list --state open --search "in:title \"$TRACKING_TITLE\"" --json number,title \
            --jq ".[] | select(.title == \"$TRACKING_TITLE\") | .number" | head -n1 || true)
          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" --body "$body" || echo "::warning::Failed to comment on tracking Issue #$existing_issue"
          else
            gh issue create --title "$TRACKING_TITLE" --body "$body" || echo "::warning::Failed to create tracking Issue"
          fi
          echo "::error::Canary build failed for the ${streak}th consecutive scheduled day -- see tracking Issue."
          exit 1
